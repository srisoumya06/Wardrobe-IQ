<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Wardrobe IQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="brand-symbol" style="margin: 0 auto 12px auto; width: 48px; height: 48px; font-size: 1.4rem;">IQ</div>
      <h1>Create Wardrobe</h1>
      <p class="text-muted" style="margin-top: 4px;">Start organising your clothes & elevating your style</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. srisoumya" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. soumya@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Create My Account (+50 Pts)</button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--color-muted-taupe);">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="font-weight: 600; text-decoration: underline;">Sign in</a>
    </div>
  </div>
</body>
</html>
