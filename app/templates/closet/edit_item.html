{% extends "base.html" %}
{% block title %}Edit {{ item.name }} — Digital Closet{% endblock %}
{% block page_title %}Edit Garment Details{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Edit Garment</h1>
      <p class="page-subtitle">Update item attributes, care specifications, or replace the photo.</p>
    </div>
    <a href="{{ url_for('closet.item_detail', item_id=item.id) }}" class="btn btn-secondary btn-sm">Cancel</a>
  </div>

  <form method="POST" action="{{ url_for('closet.edit_item', item_id=item.id) }}" enctype="multipart/form-data" class="iq-card" style="padding: 32px;">
    <div style="display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start;">
      <div>
        <div style="border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-soft-beige); margin-bottom: 12px;">
          <img src="{{ url_for('static', filename=item.image_path) }}" alt="{{ item.name }}" style="width: 100%; height: 280px; object-fit: cover;">
        </div>
        <label class="btn btn-secondary btn-sm" style="width: 100%; cursor: pointer;">
          Change Photo
          <input type="file" name="clothing_image" accept="image/*" style="display: none;">
        </label>
      </div>

      <div>
        <div class="form-group">
          <label class="form-label" for="name">Garment Title</label>
          <input type="text" id="name" name="name" class="form-control" value="{{ item.name }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" name="category" class="form-select" required>
              {% for cat in categories %}
              <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="subcategory">Subcategory</label>
            <input type="text" id="subcategory" name="subcategory" class="form-control" value="{{ item.subcategory or '' }}">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="color">Colour</label>
            <input type="text" id="color" name="color" class="form-control" value="{{ item.color }}" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="color_hex">Colour Hex</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="color" value="{{ item.color_hex }}" style="width: 44px; height: 42px; border: 1px solid var(--color-soft-beige); border-radius: var(--radius-sm);" onchange="document.getElementById('color_hex').value = this.value">
              <input type="text" id="color_hex" name="color_hex" class="form-control" value="{{ item.color_hex }}">
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="pattern">Pattern</label>
            <input type="text" id="pattern" name="pattern" class="form-control" value="{{ item.pattern }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="style">Style</label>
            <input type="text" id="style" name="style" class="form-control" value="{{ item.style }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="season">Season</label>
            <input type="text" id="season" name="season" class="form-control" value="{{ item.season }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="occasions">Suitable Occasions</label>
          <input type="text" id="occasions" name="occasions" class="form-control" value="{{ item.occasions }}">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="brand">Brand</label>
            <input type="text" id="brand" name="brand" class="form-control" value="{{ item.brand or '' }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="size">Size</label>
            <input type="text" id="size" name="size" class="form-control" value="{{ item.size or '' }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="purchase_price">Price (₹)</label>
            <input type="number" step="1" id="purchase_price" name="purchase_price" class="form-control" value="{{ item.purchase_price or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="notes">Curator Notes</label>
          <textarea id="notes" name="notes" class="form-control" rows="2">{{ item.notes or '' }}</textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <a href="{{ url_for('closet.item_detail', item_id=item.id) }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
